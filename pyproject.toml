[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "basaltic-red"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Core: the extension returns pyarrow Table/RecordBatch — this is the
    # only hard runtime dependency.
    "pyarrow>=25.0.0",
]

# Install a group with:  uv sync --extra <group>   (--all-extras for everything)
[project.optional-dependencies]
interop = [
    # Ecosystem tools consume the SDK's arrow bridge (stream.to_pyarrow()) directly
    "polars>=1.43.0",   # pl.from_arrow(...)
    "duckdb>=1.5.0",    # duckdb.from_arrow(...)
    "pandas>=3.0.0",    # table.to_pandas()
    "numpy>=2.5.0",
]
notebook = [
    # Jupyter Notebook & data visualization ecosystem (demo.ipynb)
    "jupyterlab>=4.6.0",
    "notebook>=7.6.0",
    "ipython>=9.16.0",
    "ipywidgets>=8.1.0",
    "tabulate>=0.10.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "pandas-stubs~=3.0.5",
]
dev = [
    # Test & build tooling
    "pytest>=9.1.0",
    "maturin>=1.14.0",  # uv run maturin develop
]
doc = [
    "zensical>=0.0.43",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "basaltic_red"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]
