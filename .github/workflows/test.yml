name: Test Suite (src & tests)

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'requirements.txt'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'requirements.txt'

jobs:
  rust-test:
    name: Rust Tests (src & tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo tests (src & tests)
        run: cargo test --verbose

  python-test:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python package with maturin
        run: maturin develop

      - name: Run Python tests
        run: pytest tests/python -v --junitxml=test-results-python.xml

      - name: Run CLI tests
        run: bash tests/cli/test_cli.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results-python.xml
            .pytest_cache/
          retention-days: 7