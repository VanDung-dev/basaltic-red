name: Test Suite (src & tests)

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  rust-test:
    name: Rust Tests (src & tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo tests (src & tests)
        run: cargo test --verbose 2>&1 | tee rust-test-results.txt

      - name: Upload Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: rust-test-results.txt
          retention-days: 7

  python-test:
    name: Python & CLI Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python package with maturin
        run: |
          maturin build --out dist
          pip install dist/*.whl

      - name: Run Python tests
        run: pytest tests/python -v --junitxml=test-results-python.xml

      - name: Run CLI tests
        run: bash tests/cli/test_cli.sh 2>&1 | tee cli-test-results.txt

      - name: Upload Python & CLI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-cli-test-results-${{ matrix.python-version }}
          path: |
            test-results-python.xml
            cli-test-results.txt
          retention-days: 7