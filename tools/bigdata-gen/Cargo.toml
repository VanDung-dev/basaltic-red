[package]
name = "bigdata-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow = { version = "59.1.0", features = ["ipc"] }
arrow-csv = "59.1.0"
arrow-json = "59.1.0"
parquet = { version = "59.1.0", features = ["arrow", "zstd"] }
clap = { version = "4.6.4", features = ["derive"] }
rand = "0.8.7"
rand_chacha = "0.3.1"
anyhow = "1.0"
apache-avro = "0.21.0"
rust_xlsxwriter = "0.97.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3.0"
rmpv = { version = "1.3.1", features = ["with-serde"] }
