[workspace]
members = [".", "tools/bigdata-gen", "tools/relational-db-gen"]
resolver = "2"


[package]
name = "basaltic-red"
version = "0.1.0"
edition = "2021"

[lib]
name = "basaltic_red"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bazan"
path = "src/main.rs"


[dependencies]
arrow = { version = "59.1.0", features = ["ffi", "pyarrow", "csv", "json", "ipc"] }
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
arrow-select = "59.1.0"
arrow-buffer = "59.1.0"
arrow-csv = "59.1.0"
arrow-json = "59.1.0"
arrow-ipc = "59.1.0"
parquet = { version = "59.1.0", features = ["arrow", "async"] }
apache-avro = "0.21.0"
calamine = "0.36.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3.0"
rmpv = { version = "1.3.1", features = ["with-serde"] }

pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }

rayon = "1.10.0"
tokio = { version = "1.37.0", features = ["full"] }
anyhow = "1.0.82"
regex = "1.10.0"
clap = { version = "4.5", features = ["derive"] }


[dev-dependencies]
tempfile = "3.10.1"
