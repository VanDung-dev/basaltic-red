[package]
name = "basaltic-red"
version = "0.1.0"
edition = "2021"

[lib]
name = "basaltic_red"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { version = "59.1.0", features = ["ffi", "pyarrow", "csv", "json"] }
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
arrow-select = "59.1.0"
arrow-buffer = "59.1.0"
arrow-csv = "59.1.0"
arrow-json = "59.1.0"
parquet = { version = "59.1.0", features = ["arrow", "async"] }

pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }

rayon = "1.10.0"
tokio = { version = "1.37.0", features = ["full"] }
anyhow = "1.0.82"
regex = "1.10.0"

[dev-dependencies]
tempfile = "3.10.1"
