site_name: Basaltic-Red Docs
site_url: https://vandung-dev.github.io/basaltic-red/vi/
site_description: Công cụ Data Lake Zero-Copy & Bộ lọc chất lượng dữ liệu SIMD hiệu năng cao viết bằng Rust & Apache Arrow
site_author: Nguyễn Lê Văn Dũng
repo_name: VanDung-dev/basaltic-red
repo_url: https://github.com/VanDung-dev/basaltic-red
edit_uri: https://github.com/VanDung-dev/basaltic-red/tree/master/docs/vi/
copyright: Copyright &copy; 2026 Nguyễn Lê Văn Dũng

docs_dir: docs/vi/
site_dir: site/vi
use_directory_urls: true

exclude_docs: |
  site/
  locales/
  *.py
  *.bak
  *.toml

theme:
  name: zensical
  language: vi
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Trang chủ: index.md
  - Bắt đầu:
      - Cài đặt: getting-started/install.md
      - Bắt đầu nhanh: getting-started/quickstart.md
      - Khái niệm cơ bản: getting-started/concepts.md
  - Thành phần:
      - Tổng quan: architecture/overview.md
      - Lõi MatrixEngine: architecture/matrix-engine.md
      - Nhân SIMD Bitmask: architecture/simd-kernel.md
      - Định dạng & Magic Byte: architecture/formats.md
      - Tầng SQL DataFusion: architecture/datafusion.md
      - Lake Map & Lake Doctor: architecture/lake-map.md
      - Đường ống Lọc: architecture/filtering-pipeline.md
      - Đường ống Lakehouse: architecture/lakehouse-pipeline.md
  - Hướng dẫn sử dụng:
      - Lọc chất lượng dữ liệu: workflows/data-quality-filtering.md
      - Phân vùng Dữ liệu Sạch & Rác: workflows/partitioning.md
      - Bác sĩ Data Lake & Tự phục hồi: workflows/lake-doctor.md
      - Phân tích SQL Zero-Copy: workflows/sql-analytics.md
      - Xử lý dữ liệu lớn đa tệp với Rayon: how-to/parallel-processing.md
      - Tích hợp Polars & DuckDB: how-to/integrate-polars-duckdb.md
      - Hướng dẫn chạy Demo NYC Taxi: how-to/run-demo-notebook.md
      - Khắc phục sự cố & Tối ưu: how-to/troubleshooting.md
  - Tham chiếu:
      - Python API Reference: reference/python-api.md
      - Cú pháp quy tắc lọc: reference/rule-syntax.md
      - Đặc tả bản đồ nhị phân: reference/lake-map-spec.md
      - Mã lỗi & Cột kiểm toán: reference/audit-codes.md
      - Bảng thuật ngữ: glossary.md
  - Khác:
      - Báo cáo hiệu năng & Benchmarks: other/benchmarks.md
      - Nhật ký thay đổi: changelog.md

plugins:
  - search

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - attr_list
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VanDung-dev/basaltic-red
      name: GitHub
  alternate:
    - name: English
      link: /basaltic-red/
      lang: en
    - name: Tiếng Việt
      link: /basaltic-red/vi/
      lang: vi
